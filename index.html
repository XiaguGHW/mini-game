<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水果生存射击</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script defer src="src/data.js"></script>
  <script defer src="src/game-scene.js?v=performance-1"></script>
  <script defer src="src/main.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">PHASER FOUNDATION</p>
      <h1>水果生存射击</h1>
      <p class="subtitle">在甜点怪物中存活，自动发射水果种子。</p>
    </header>

    <section id="hud" class="hud" aria-label="游戏状态">
      <div class="stat-card"><span>等级</span><strong id="level-display">1</strong></div>
      <div class="stat-card"><span>攻击力</span><strong id="attack-display">1</strong></div>
      <div class="stat-card"><span>生命</span><strong id="hp-display">3 / 3</strong></div>
      <div class="stat-card"><span>分数</span><strong id="score-display">0</strong></div>
      <div class="xp-card">
        <div class="xp-label"><span>经验</span><strong id="xp-display">0 / 34</strong></div>
        <div class="xp-track"><div id="xp-bar" class="xp-fill"></div></div>
      </div>
    </section>

    <section id="game-frame" class="game-frame" aria-label="游戏区域">
      <div id="touch-controls" class="touch-controls" aria-label="触屏移动控制">
        <div id="move-stick" class="move-stick" role="slider" aria-label="移动摇杆" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="move-knob" class="move-knob"></span>
        </div>
      </div>
    </section>

    <section id="menu" class="overlay-card">
      <p class="eyebrow">CHOOSE A FRUIT</p>
      <h2>选择你的水果伙伴</h2>
      <p class="overlay-copy">WASD 或方向键移动。角色会自动瞄准最近的敌人。</p>
      <div id="character-select" class="character-grid"></div>
      <button id="start-button" class="primary-button" disabled>开始游戏</button>
    </section>

    <section id="game-over" class="overlay-card hidden" aria-live="polite">
      <p class="eyebrow">RUN COMPLETE</p>
      <h2>这次先到这里</h2>
      <div class="result-grid">
        <div><span>等级</span><strong id="final-level">1</strong></div>
        <div><span>分数</span><strong id="final-score">0</strong></div>
        <div><span>击败</span><strong id="final-kills">0</strong></div>
      </div>
      <button id="restart-button" class="primary-button">再来一次</button>
    </section>
  </main>
</body>
</html>
