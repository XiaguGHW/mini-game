<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水果生存射击</title>
  <style>
:root {
  --ink: #4b3d3a;
  --muted-ink: #796b68;
  --berry: #b85d73;
  --berry-soft: #f2dce2;
  --cream: #f7f2ea;
  --panel: rgba(255, 252, 247, 0.9);
  --line: rgba(112, 82, 74, 0.14);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  font-family: ui-rounded, "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(circle at top, #fffaf2 0%, var(--cream) 55%, #eee3d6 100%);
}
button { font: inherit; }
.game-shell { width: min(1040px, 100%); margin: 0 auto; padding: 20px 18px 28px; position: relative; }
.game-header { text-align: center; margin-bottom: 14px; }
.eyebrow { margin: 0 0 5px; color: var(--berry); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.16em; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: 5px; font-size: clamp(1.7rem, 4vw, 2.35rem); letter-spacing: -0.05em; }
h2 { margin-bottom: 8px; font-size: clamp(1.45rem, 3vw, 1.9rem); letter-spacing: -0.04em; }
.subtitle, .overlay-copy { color: var(--muted-ink); line-height: 1.55; }
.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(180px, 1.55fr); gap: 9px; margin-bottom: 12px; }
.stat-card, .xp-card {
  min-height: 59px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--panel); box-shadow: 0 10px 24px rgba(88, 62, 55, 0.08), inset 0 1px 0 rgba(255,255,255,.85);
}
.stat-card span, .xp-label { display: block; color: var(--muted-ink); font-size: 0.72rem; font-weight: 700; }
.stat-card strong { display: block; margin-top: 3px; font-size: 1.12rem; }
.xp-label { display: flex; justify-content: space-between; gap: 8px; }
.xp-track { height: 9px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: #eadfd5; }
.xp-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d79958, #c46877); transition: width .16s ease-out; }
.game-frame { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: #f4ede5; box-shadow: 0 18px 42px rgba(88, 62, 55, 0.15); }
.game-frame canvas { display: block; width: 100% !important; height: 100% !important; }
.overlay-card {
  position: absolute; z-index: 2; left: 50%; top: 50%; width: min(560px, calc(100% - 36px)); padding: 28px;
  text-align: center; transform: translate(-50%, -10%); border: 1px solid rgba(255,255,255,.9); border-radius: 25px;
  background: rgba(255, 252, 247, .96); box-shadow: 0 26px 70px rgba(70, 46, 40, .22);
}
.hidden { display: none; }
.character-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.character-button { min-height: 132px; padding: 13px 8px; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); background: #fffdfa; cursor: pointer; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
.character-button:hover, .character-button.selected { transform: translateY(-3px); border-color: var(--berry); box-shadow: 0 12px 20px rgba(120, 76, 87, .13); }
.character-icon { display: block; margin-bottom: 7px; font-size: 2.55rem; }
.character-name { display: block; font-weight: 800; }
.character-desc { display: block; margin-top: 4px; color: var(--muted-ink); font-size: .72rem; line-height: 1.35; }
.primary-button { padding: 12px 28px; border: 0; border-radius: 999px; color: #fff; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #c86b80, #ab526a); box-shadow: 0 7px 0 #91475b, 0 12px 22px rgba(152, 70, 91, .28); transition: transform .12s ease, box-shadow .12s ease; }
.primary-button:hover { transform: translateY(-2px); box-shadow: 0 9px 0 #91475b, 0 15px 25px rgba(152, 70, 91, .28); }
.primary-button:active { transform: translateY(3px); box-shadow: 0 4px 0 #91475b; }
.primary-button:disabled { cursor: default; opacity: .46; transform: none; box-shadow: none; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
.result-grid div { padding: 12px 6px; border-radius: 14px; background: #f8f1e9; }
.result-grid span { display: block; color: var(--muted-ink); font-size: .75rem; }
.result-grid strong { display: block; margin-top: 3px; font-size: 1.35rem; }
@media (max-width: 720px) { .game-shell { padding: 14px 10px 20px; } .hud { grid-template-columns: repeat(2, 1fr); } .xp-card { grid-column: span 2; } .game-frame { border-radius: 18px; } .overlay-card { padding: 22px 15px; transform: translate(-50%, -4%); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <p class="eyebrow">PHASER FOUNDATION</p>
      <h1>水果生存射击</h1>
      <p class="subtitle">在甜点怪物中存活，自动发射水果种子。</p>
    </header>

    <section id="hud" class="hud" aria-label="游戏状态">
      <div class="stat-card"><span>等级</span><strong id="level-display">1</strong></div>
      <div class="stat-card"><span>攻击力</span><strong id="attack-display">1</strong></div>
      <div class="stat-card"><span>生命</span><strong id="hp-display">3 / 3</strong></div>
      <div class="stat-card"><span>分数</span><strong id="score-display">0</strong></div>
      <div class="xp-card">
        <div class="xp-label"><span>经验</span><strong id="xp-display">0 / 34</strong></div>
        <div class="xp-track"><div id="xp-bar" class="xp-fill"></div></div>
      </div>
    </section>

    <section id="game-frame" class="game-frame" aria-label="游戏区域"></section>

    <section id="menu" class="overlay-card">
      <p class="eyebrow">CHOOSE A FRUIT</p>
      <h2>选择你的水果伙伴</h2>
      <p class="overlay-copy">WASD 或方向键移动。角色会自动瞄准最近的敌人。</p>
      <div id="character-select" class="character-grid"></div>
      <button id="start-button" class="primary-button" disabled>开始游戏</button>
    </section>

    <section id="game-over" class="overlay-card hidden" aria-live="polite">
      <p class="eyebrow">RUN COMPLETE</p>
      <h2>这次先到这里</h2>
      <div class="result-grid">
        <div><span>等级</span><strong id="final-level">1</strong></div>
        <div><span>分数</span><strong id="final-score">0</strong></div>
        <div><span>击败</span><strong id="final-kills">0</strong></div>
      </div>
      <button id="restart-button" class="primary-button">再来一次</button>
    </section>
  </main>
  <script>
(function () {
  window.GameData = {
    world: { width: 7200, height: 5400 },
    player: {
      speed: 250,
      maxHp: 3,
      xpPerLevel: 34,
      fireDelay: 280,
      bulletSpeed: 620,
      invulnerability: 850
    },
    characters: {
      strawberry: { name: '草莓', desc: '平衡型 · 小黄种子', icon: '🍓', color: 0xeb6687, accent: 0xf8c950, bulletSize: 10, damage: 1 },
      grape: { name: '葡萄', desc: '射速更快 · 紫色种子', icon: '🍇', color: 0x9364c7, accent: 0xdcc3f2, bulletSize: 8, damage: 1, fireRateBonus: 45 },
      watermelon: { name: '西瓜', desc: '伤害更高 · 黑色种子', icon: '🍉', color: 0xe66a6f, accent: 0x453437, bulletSize: 12, damage: 2 }
    },
    enemies: [
      { key: 'donut', color: 0xdf7897, hp: 2, speed: 82, radius: 23, score: 10, weight: 30 },
      { key: 'macaron', color: 0x8ca8d8, hp: 1, speed: 118, radius: 20, score: 8, weight: 25 },
      { key: 'cookie', color: 0xc39a70, hp: 3, speed: 64, radius: 25, score: 15, weight: 20 },
      { key: 'icecream', color: 0xd29ab4, hp: 2, speed: 94, radius: 25, score: 12, weight: 15 },
      { key: 'cupcake', color: 0xc97594, hp: 4, speed: 56, radius: 28, score: 20, weight: 10 }
    ]
  };
}());
  </script>
  <script>
(function () {
  const Data = window.GameData;

  class GameScene extends Phaser.Scene {
    constructor() {
      super({ key: 'GameScene' });
      this.characterKey = 'strawberry';
      this.running = false;
    }

    createTextures() {
      const makeCircleTexture = (key, color, radius, outline) => {
        if (this.textures.exists(key)) return;
        const graphics = this.make.graphics({ x: 0, y: 0, add: false });
        if (outline) graphics.fillStyle(outline, 1).fillCircle(radius + 2, radius + 2, radius + 2);
        graphics.fillStyle(color, 1).fillCircle(radius + 2, radius + 2, radius);
        graphics.fillStyle(0xffffff, 0.3).fillCircle(radius * 0.63 + 2, radius * 0.63 + 2, Math.max(2, radius * 0.24));
        graphics.generateTexture(key, radius * 2 + 4, radius * 2 + 4);
        graphics.destroy();
      };

      Object.entries(Data.characters).forEach(([key, character]) => makeCircleTexture(`player-${key}`, character.color, 24, 0xffffff));
      Data.enemies.forEach(enemy => makeCircleTexture(`enemy-${enemy.key}`, enemy.color, enemy.radius, 0xffffff));
      makeCircleTexture('xp-orb', 0xf6c85a, 7, 0xffffff);
      makeCircleTexture('spark', 0xffffff, 3, 0);

      if (!this.textures.exists('ground')) {
        const graphics = this.make.graphics({ x: 0, y: 0, add: false });
        graphics.fillStyle(0xf4ede5, 1).fillRect(0, 0, 80, 80);
        graphics.fillStyle(0xece2d8, 1).fillRect(0, 0, 40, 40).fillRect(40, 40, 40, 40);
        graphics.lineStyle(1, 0xffffff, 0.2).strokeRect(0, 0, 80, 80);
        graphics.generateTexture('ground', 80, 80);
        graphics.destroy();
      }
    }

    create(data) {
      this.characterKey = data.characterKey || this.characterKey;
      this.createTextures();
      this.physics.world.setBounds(0, 0, Data.world.width, Data.world.height);
      this.add.tileSprite(0, 0, Data.world.width, Data.world.height, 'ground').setOrigin(0);

      this.enemies = this.physics.add.group();
      this.bullets = this.physics.add.group();
      this.xpOrbs = this.add.group();
      this.stats = this.newStats();
      this.lastFireAt = 0;
      this.lastDamageAt = -Infinity;
      this.spawnAccumulator = 0;
      this.running = true;

      this.player = this.physics.add.sprite(Data.world.width / 2, Data.world.height / 2, `player-${this.characterKey}`);
      this.player.setCircle(21, 3, 3).setCollideWorldBounds(true).setDepth(3);
      this.player.setData('baseScale', 1);
      this.cameras.main.startFollow(this.player, true, 0.11, 0.11);
      this.cameras.main.setBounds(0, 0, Data.world.width, Data.world.height);
      this.cameras.main.setBackgroundColor('#f4ede5');

      this.cursors = this.input.keyboard.createCursorKeys();
      this.wasd = this.input.keyboard.addKeys({ up: 'W', down: 'S', left: 'A', right: 'D' });
      this.physics.add.overlap(this.bullets, this.enemies, this.handleBulletHit, undefined, this);
      this.physics.add.overlap(this.player, this.enemies, this.handlePlayerHit, undefined, this);
      this.events.on(Phaser.Scenes.Events.SHUTDOWN, this.shutdown, this);
      this.publishHud();
    }

    newStats() {
      const character = Data.characters[this.characterKey];
      return {
        level: 1,
        xp: 0,
        xpNeeded: Data.player.xpPerLevel,
        attack: character.damage,
        maxHp: Data.player.maxHp,
        hp: Data.player.maxHp,
        score: 0,
        kills: 0,
        bulletMultiplier: 1,
        fireDelay: Data.player.fireDelay - (character.fireRateBonus || 0)
      };
    }

    update(time, delta) {
      if (!this.running) return;
      this.movePlayer();
      this.moveEnemies(delta);
      this.updateBullets(time);
      this.updateXpOrbs(delta);
      this.tryFire(time);
      this.spawnAccumulator += delta;
      const spawnDelay = Math.max(280, 920 - this.stats.level * 32);
      if (this.spawnAccumulator >= spawnDelay) {
        this.spawnAccumulator = 0;
        this.spawnEnemy();
      }
    }

    movePlayer() {
      let x = 0;
      let y = 0;
      if (this.cursors.left.isDown || this.wasd.left.isDown) x -= 1;
      if (this.cursors.right.isDown || this.wasd.right.isDown) x += 1;
      if (this.cursors.up.isDown || this.wasd.up.isDown) y -= 1;
      if (this.cursors.down.isDown || this.wasd.down.isDown) y += 1;
      const direction = new Phaser.Math.Vector2(x, y).normalize().scale(Data.player.speed);
      this.player.setVelocity(direction.x, direction.y);
      const moving = x !== 0 || y !== 0;
      this.player.setRotation(moving ? Phaser.Math.Angle.Between(0, 0, x, y) * 0.06 : 0);
    }

    moveEnemies(delta) {
      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        const type = enemy.getData('type');
        this.physics.moveToObject(enemy, this.player, type.speed);
        enemy.setRotation(enemy.rotation + delta * 0.0017);
      });
    }

    tryFire(time) {
      if (time - this.lastFireAt < this.stats.fireDelay) return;
      const target = this.closestEnemy();
      if (!target) return;
      this.lastFireAt = time;
      const character = Data.characters[this.characterKey];
      const bullet = this.bullets.create(this.player.x, this.player.y, 'spark');
      const radius = character.bulletSize * this.stats.bulletMultiplier;
      bullet.setDisplaySize(radius * 2, radius * 2).setTint(character.accent).setDepth(2);
      bullet.setData({ expiresAt: time + 1450, damage: this.stats.attack });
      this.physics.moveToObject(bullet, target, Data.player.bulletSpeed);
      this.tweens.add({ targets: this.player, scaleX: 0.91, scaleY: 1.09, duration: 45, yoyo: true, ease: 'Sine.out' });
    }

    closestEnemy() {
      let nearest = null;
      let distance = Infinity;
      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        const current = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
        if (current < distance) { distance = current; nearest = enemy; }
      });
      return nearest;
    }

    updateBullets(time) {
      this.bullets.getChildren().forEach(bullet => {
        if (bullet.active && bullet.getData('expiresAt') <= time) bullet.destroy();
      });
    }

    spawnEnemy() {
      const type = this.pickEnemyType();
      const camera = this.cameras.main.worldView;
      const margin = 75;
      const side = Phaser.Math.Between(0, 3);
      let x;
      let y;
      if (side === 0) { x = Phaser.Math.Between(camera.left, camera.right); y = camera.top - margin; }
      if (side === 1) { x = camera.right + margin; y = Phaser.Math.Between(camera.top, camera.bottom); }
      if (side === 2) { x = Phaser.Math.Between(camera.left, camera.right); y = camera.bottom + margin; }
      if (side === 3) { x = camera.left - margin; y = Phaser.Math.Between(camera.top, camera.bottom); }
      const enemy = this.enemies.create(x, y, `enemy-${type.key}`);
      enemy.setCircle(type.radius - 2, 4, 4).setDepth(2).setData({ type, hp: type.hp + Math.floor((this.stats.level - 1) / 4) });
      this.tweens.add({ targets: enemy, scaleX: 1.06, scaleY: 0.94, duration: 480, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    }

    pickEnemyType() {
      const total = Data.enemies.reduce((sum, enemy) => sum + enemy.weight, 0);
      let needle = Phaser.Math.Between(1, total);
      for (const enemy of Data.enemies) {
        needle -= enemy.weight;
        if (needle <= 0) return enemy;
      }
      return Data.enemies[0];
    }

    handleBulletHit(bullet, enemy) {
      if (!bullet.active || !enemy.active) return;
      bullet.destroy();
      const hp = enemy.getData('hp') - bullet.getData('damage');
      enemy.setData('hp', hp).setTintFill(0xffffff);
      this.time.delayedCall(65, () => enemy.active && enemy.clearTint());
      this.tweens.add({ targets: enemy, scaleX: 0.78, scaleY: 0.78, duration: 50, yoyo: true, ease: 'Quad.out' });
      this.createBurst(enemy.x, enemy.y, enemy.getData('type').color, 6);
      if (hp <= 0) this.killEnemy(enemy);
    }

    killEnemy(enemy) {
      if (!enemy.active) return;
      const type = enemy.getData('type');
      this.stats.kills += 1;
      this.stats.score += type.score;
      this.createBurst(enemy.x, enemy.y, type.color, 14);
      this.dropXp(enemy.x, enemy.y, Math.max(1, Math.ceil(type.score / 10)));
      this.tweens.killTweensOf(enemy);
      enemy.destroy();
      this.publishHud();
    }

    dropXp(x, y, count) {
      for (let index = 0; index < count; index += 1) {
        const orb = this.add.sprite(x, y, 'xp-orb').setDepth(1);
        const angle = Phaser.Math.FloatBetween(0, Phaser.Math.PI2);
        orb.setData({ value: 5, vx: Math.cos(angle) * Phaser.Math.Between(80, 150), vy: Math.sin(angle) * Phaser.Math.Between(80, 150) });
        this.xpOrbs.add(orb);
      }
    }

    updateXpOrbs(delta) {
      const dt = delta / 1000;
      this.xpOrbs.getChildren().forEach(orb => {
        if (!orb.active) return;
        const dx = this.player.x - orb.x;
        const dy = this.player.y - orb.y;
        const distance = Math.hypot(dx, dy);
        let vx = orb.getData('vx') * 0.9;
        let vy = orb.getData('vy') * 0.9;
        if (distance < 180 && distance > 0) {
          const pull = Phaser.Math.Linear(80, 1100, 1 - distance / 180);
          vx = (dx / distance) * pull;
          vy = (dy / distance) * pull;
        }
        orb.setData({ vx, vy }).setPosition(orb.x + vx * dt, orb.y + vy * dt);
        if (distance < 30) {
          const value = orb.getData('value');
          orb.destroy();
          this.gainXp(value);
        }
      });
    }

    gainXp(amount) {
      this.stats.xp += amount;
      while (this.stats.xp >= this.stats.xpNeeded) {
        this.stats.xp -= this.stats.xpNeeded;
        this.levelUp();
      }
      this.publishHud();
    }

    levelUp() {
      this.stats.level += 1;
      this.stats.attack += 1;
      this.stats.maxHp += 1;
      this.stats.hp = this.stats.maxHp;
      this.stats.bulletMultiplier += 0.08;
      this.stats.fireDelay = Math.max(110, this.stats.fireDelay - 6);
      this.cameras.main.flash(150, 255, 239, 181, false);
      this.cameras.main.shake(90, 0.003);
      this.tweens.add({ targets: this.player, scale: 1.35, duration: 130, yoyo: true, ease: 'Back.out' });
    }

    handlePlayerHit(player, enemy) {
      if (!this.running || this.time.now - this.lastDamageAt < Data.player.invulnerability) return;
      this.lastDamageAt = this.time.now;
      this.stats.hp -= 1;
      this.cameras.main.shake(110, 0.008);
      this.tweens.add({ targets: this.player, alpha: 0.25, duration: 80, yoyo: true, repeat: 3 });
      this.createBurst(player.x, player.y, 0xd75a6d, 8);
      this.publishHud();
      if (this.stats.hp <= 0) this.finishRun();
    }

    createBurst(x, y, color, count) {
      for (let index = 0; index < count; index += 1) {
        const spark = this.add.sprite(x, y, 'spark').setTint(color).setDepth(5);
        const angle = Phaser.Math.FloatBetween(0, Phaser.Math.PI2);
        const length = Phaser.Math.Between(16, 46);
        this.tweens.add({ targets: spark, x: x + Math.cos(angle) * length, y: y + Math.sin(angle) * length, alpha: 0, scale: Phaser.Math.FloatBetween(0.2, 0.7), duration: Phaser.Math.Between(180, 320), ease: 'Quad.out', onComplete: () => spark.destroy() });
      }
    }

    finishRun() {
      this.running = false;
      this.player.setVelocity(0, 0);
      window.GameUI.showGameOver(this.stats);
    }

    publishHud() { window.GameUI.updateHud(this.stats); }

    shutdown() {
      this.tweens.killAll();
      this.events.off(Phaser.Scenes.Events.SHUTDOWN, this.shutdown, this);
    }
  }

  window.GameScene = GameScene;
}());
  </script>
  <script>
(function () {
  const Data = window.GameData;
  const select = document.getElementById('character-select');
  const menu = document.getElementById('menu');
  const gameOver = document.getElementById('game-over');
  const startButton = document.getElementById('start-button');
  const restartButton = document.getElementById('restart-button');
  let selectedCharacter = null;
  let game;

  const fields = {
    level: document.getElementById('level-display'), attack: document.getElementById('attack-display'),
    hp: document.getElementById('hp-display'), score: document.getElementById('score-display'),
    xp: document.getElementById('xp-display'), xpBar: document.getElementById('xp-bar')
  };

  window.GameUI = {
    updateHud(stats) {
      fields.level.textContent = stats.level;
      fields.attack.textContent = stats.attack;
      fields.hp.textContent = `${stats.hp} / ${stats.maxHp}`;
      fields.score.textContent = stats.score;
      fields.xp.textContent = `${stats.xp} / ${stats.xpNeeded}`;
      fields.xpBar.style.width = `${(stats.xp / stats.xpNeeded) * 100}%`;
    },
    showGameOver(stats) {
      document.getElementById('final-level').textContent = stats.level;
      document.getElementById('final-score').textContent = stats.score;
      document.getElementById('final-kills').textContent = stats.kills;
      gameOver.classList.remove('hidden');
    }
  };

  Object.entries(Data.characters).forEach(([key, character]) => {
    const button = document.createElement('button');
    button.className = 'character-button';
    button.type = 'button';
    button.dataset.character = key;
    button.innerHTML = `<span class="character-icon">${character.icon}</span><span class="character-name">${character.name}</span><span class="character-desc">${character.desc}</span>`;
    button.addEventListener('click', () => {
      selectedCharacter = key;
      select.querySelectorAll('button').forEach(item => item.classList.toggle('selected', item === button));
      startButton.disabled = false;
    });
    select.appendChild(button);
  });

  function bootGame(characterKey) {
    menu.classList.add('hidden');
    gameOver.classList.add('hidden');
    if (!game) {
      game = new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-frame',
        width: 960,
        height: 720,
        backgroundColor: '#f4ede5',
        physics: { default: 'arcade', arcade: { debug: false } },
        scene: []
      });
      game.events.once(Phaser.Core.Events.READY, () => game.scene.add('GameScene', window.GameScene, true, { characterKey }));
      return;
    }
    game.scene.start('GameScene', { characterKey });
  }

  startButton.addEventListener('click', () => selectedCharacter && bootGame(selectedCharacter));
  restartButton.addEventListener('click', () => selectedCharacter && bootGame(selectedCharacter));
  window.addEventListener('keydown', event => {
    if (event.key === 'Enter' && selectedCharacter && !menu.classList.contains('hidden')) bootGame(selectedCharacter);
  });
}());
  </script>
</body>
</html>
